name: videogame.ai
description: >-
  videogame.ai is an AI-native game development studio that uses fleets of
  autonomous AI coding agents to build, ship, and operate video games. The
  company offers full-service game development delivered in days at the cost of
  a single full-time employee, along with automated live-ops pipelines, a
  multiplayer engine optimized for AI coding agents, an AI-native asset and
  media management system, and autonomous generation of ads and creative from
  game builds. Featured titles include Zero Hour, a narrative game set on a
  frozen planet, and Imperfect World, an RPG built around time-loop mechanics.
  Backed by a16z (SR02) and Konvoy. Surfaced as an a16z portfolio company and
  profiled in the API Evangelist network; the studio publishes a marketing site
  and contact channel but no public developer API, SDK, or documentation at this
  time.
